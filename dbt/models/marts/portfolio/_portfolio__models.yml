version: 2

models:
  - name: equity_performance_summary
    description: One row per ticker summarizing return, volatility, and dividends ingested so far.
    columns:
      - name: ticker
        tests:
          - not_null
          - unique
      - name: annualized_return
        description: "(1 + avg_daily_return)^252 - 1: geometric annualization of the average daily return. Feeds the wealth simulator's default PEA-equity assumption."
