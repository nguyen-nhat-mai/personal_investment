name: france_investment_insights
version: "1.0.0"
config-version: 2

profile: france_investment_insights

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  france_investment_insights:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  france_investment_insights:
    +schema: seeds

vars:
  # Minimum transaction count for a commune/year/type's median price to be treated as
  # reliable - below this, a single outlier transaction can swing the median wildly (see the
  # Jarnages YoY anomaly investigated 2026-08-10). Used both to decide whether a YoY comparison
  # is trustworthy (int_dvf__commune_period_stats) and to drop thin markets from the final
  # opportunity score (commune_opportunity_score).
  min_reliable_transaction_count: 5
  # Opportunity-score caps, used in commune_opportunity_score.sql. Both bound how much a
  # single extreme commune can dominate its sub-score, same spirit as the YoY cap.
  max_price_cagr_pct: 0.15  # +/-15%/year - generous for real estate, still bounds small-sample noise
  high_liquidity_transactions_per_capita: 0.02  # per-type annual sales / population treated as "high" liquidity
  max_population_cagr_pct: 0.05  # +/-5%/year - generous for population growth (booming exurbs vs. rural decline)
