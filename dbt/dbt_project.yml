name: france_investment_insights
version: "1.0.0"
config-version: 2

profile: france_investment_insights

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  france_investment_insights:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  france_investment_insights:
    +schema: seeds

vars:
  # Minimum transaction count for a commune/year/type's median price to be treated as
  # reliable - below this, a single outlier transaction can swing the median wildly (see the
  # Jarnages YoY anomaly investigated 2026-08-10). Used both to decide whether a YoY comparison
  # is trustworthy (int_dvf__commune_period_stats) and to drop thin markets from the final
  # opportunity score (commune_opportunity_score).
  min_reliable_transaction_count: 5
  # Opportunity-score caps, used in commune_opportunity_score.sql. Both bound how much a
  # single extreme commune can dominate its sub-score, same spirit as the YoY cap.
  max_price_cagr_pct: 0.15  # +/-15%/year - generous for real estate, still bounds small-sample noise
  high_liquidity_transactions_per_capita: 0.02  # per-type annual sales / population treated as "high" liquidity
  max_population_cagr_pct: 0.05  # +/-5%/year - generous for population growth (booming exurbs vs. rural decline)
  # Minimum market size, used in commune_opportunity_score.sql - a hard cutoff applied on top of
  # (not instead of) min_reliable_transaction_count above. A commune/year/type can clear the
  # 5-sale statistical-reliability bar and still be a micro-market not worth ranking at all;
  # these two are the "is this even a real market" gate.
  min_commune_population: 2000
  min_annual_transaction_count: 15
  # Property tax penalty, used in commune_opportunity_score.sql. taux_foncier_bati is stored in
  # percentage-point units (e.g. 21.4 means 21.4%, not 0.214) - both vars below are in that same
  # unit. Penalty ramps linearly from 0 pts at the threshold to max_property_tax_penalty_pts at
  # 2x the threshold (e.g. Caudebronde's 73.1% against a 35% threshold is already past that 70%
  # ceiling, so it takes the full penalty) - not a new weighted factor (that's still a pending
  # decision, see the model's header comment), just a guard rail against egregious outliers.
  high_property_tax_threshold_pct: 35
  max_property_tax_penalty_pts: 15
